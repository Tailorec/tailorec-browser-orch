<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .upload-section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .upload-section h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #ccc; border-radius: 4px; }
    input[type="file"]:hover { border-color: #007bff; }
    .preview { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    .preview img { max-width: 100%; max-height: 200px; }
    .file-info { margin-top: 5px; font-size: 14px; color: #666; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>File Upload Test</h1>

  <div class="upload-section">
    <h2>Single File Upload</h2>
    <div class="form-group">
      <label for="singleFile">Select a file to upload</label>
      <input type="file" id="singleFile" name="singleFile" accept=".txt,.pdf,.doc,.docx">
      <div class="file-info" id="singleFileInfo"></div>
    </div>
    <button id="uploadSingleBtn" onclick="uploadSingle()">Upload Single File</button>
  </div>

  <div class="upload-section">
    <h2>Multiple File Upload</h2>
    <div class="form-group">
      <label for="multipleFiles">Select multiple files</label>
      <input type="file" id="multipleFiles" name="multipleFiles" multiple accept="image/*">
      <div class="file-info" id="multipleFileInfo"></div>
    </div>
    <div class="preview" id="imagePreview"></div>
    <button id="uploadMultipleBtn" onclick="uploadMultiple()">Upload Multiple Files</button>
  </div>

  <div class="upload-section">
    <h2>Drag and Drop Upload</h2>
    <div class="form-group">
      <label>Drag and drop files here</label>
      <div id="dropZone" style="padding: 40px; border: 3px dashed #ccc; text-align: center; border-radius: 8px; cursor: pointer;">
        <p>Drop files here or click to select</p>
        <input type="file" id="dropFile" name="dropFile" multiple style="display: none;">
      </div>
      <div class="file-info" id="dropFileInfo"></div>
    </div>
    <button id="uploadDropBtn" onclick="uploadDrop()">Upload Dropped Files</button>
  </div>

  <div class="upload-section">
    <h2>Upload Results</h2>
    <div id="uploadResults"></div>
  </div>

  <script>
    // Single file upload
    document.getElementById('singleFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('singleFileInfo').textContent = 
          `Selected: ${file.name} (${formatFileSize(file.size)})`;
      }
    });

    function uploadSingle() {
      const fileInput = document.getElementById('singleFile');
      const file = fileInput.files[0];
      if (!file) {
        showResult('Please select a file first', 'error');
        return;
      }
      showResult(`Uploading: ${file.name}...`, 'success');
    }

    // Multiple file upload
    document.getElementById('multipleFiles').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      const info = files.map(f => `${f.name} (${formatFileSize(f.size)})`).join(', ');
      document.getElementById('multipleFileInfo').textContent = `Selected ${files.length} files: ${info}`;
      
      // Show image previews
      const preview = document.getElementById('imagePreview');
      preview.innerHTML = '';
      files.forEach(file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            preview.appendChild(img);
          };
          reader.readAsDataURL(file);
        }
      });
    });

    function uploadMultiple() {
      const fileInput = document.getElementById('multipleFiles');
      if (fileInput.files.length === 0) {
        showResult('Please select files first', 'error');
        return;
      }
      showResult(`Uploading ${fileInput.files.length} files...`, 'success');
    }

    // Drag and drop
    const dropZone = document.getElementById('dropZone');
    const dropFile = document.getElementById('dropFile');

    dropZone.addEventListener('click', () => dropFile.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#007bff';
      dropZone.style.background = '#e7f3ff';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = '#ccc';
      dropZone.style.background = 'transparent';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#ccc';
      dropZone.style.background = 'transparent';
      
      const files = e.dataTransfer.files;
      dropFile.files = files;
      
      const info = Array.from(files).map(f => `${f.name} (${formatFileSize(f.size)})`).join(', ');
      document.getElementById('dropFileInfo').textContent = `Dropped ${files.length} files: ${info}`;
    });

    dropFile.addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      const info = files.map(f => `${f.name} (${formatFileSize(f.size)})`).join(', ');
      document.getElementById('dropFileInfo').textContent = `Selected ${files.length} files: ${info}`;
    });

    function uploadDrop() {
      const fileInput = document.getElementById('dropFile');
      if (fileInput.files.length === 0) {
        showResult('Please drop or select files first', 'error');
        return;
      }
      showResult(`Uploading ${fileInput.files.length} dropped files...`, 'success');
    }

    // Utility functions
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function showResult(message, type) {
      const results = document.getElementById('uploadResults');
      results.innerHTML = `<div class="${type}">${message}</div>`;
    }
  </script>
</body>
</html>
