<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
    .pagination-section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .pagination-section h2 { margin-top: 0; color: #333; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f8f9fa; font-weight: bold; }
    tr:hover { background: #f8f9fa; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
    .pagination button { padding: 8px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
    .pagination button:hover:not(:disabled) { background: #e9ecef; }
    .pagination button.active { background: #007bff; color: white; border-color: #007bff; }
    .pagination button:disabled { background: #e9ecef; cursor: not-allowed; opacity: 0.6; }
    .page-info { margin: 10px 0; color: #666; }
    .items-per-page { margin-bottom: 15px; }
    .items-per-page select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Pagination Test</h1>

  <div class="pagination-section">
    <h2>User List with Pagination</h2>
    
    <div class="items-per-page">
      <label for="itemsPerPage">Items per page: </label>
      <select id="itemsPerPage" onchange="changeItemsPerPage()">
        <option value="5">5 per page</option>
        <option value="10" selected>10 per page</option>
        <option value="20">20 per page</option>
        <option value="50">50 per page</option>
      </select>
    </div>

    <div class="page-info" id="pageInfo">Showing 1-10 of 50 entries</div>

    <div class="table-container">
      <table id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="usersBody">
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination">
    </div>
  </div>

  <script>
    const allUsers = Array.from({ length: 50 }, (_, i) => ({
      id: i + 1,
      name: `User ${i + 1}`,
      email: `user${i + 1}@example.com`,
      role: ['Admin', 'Editor', 'Viewer'][i % 3],
      status: ['Active', 'Inactive', 'Pending'][i % 3]
    }));

    let currentPage = 1;
    let itemsPerPage = 10;

    function getUsersForPage(page) {
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      return allUsers.slice(start, end);
    }

    function getTotalPages() {
      return Math.ceil(allUsers.length / itemsPerPage);
    }

    function renderTable() {
      const tbody = document.getElementById('usersBody');
      const users = getUsersForPage(currentPage);
      
      tbody.innerHTML = users.map(user => `
        <tr data-id="${user.id}">
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.role}</td>
          <td><span style="color: ${user.status === 'Active' ? 'green' : user.status === 'Inactive' ? 'red' : 'orange'}">${user.status}</span></td>
        </tr>
      `).join('');

      updatePageInfo();
    }

    function updatePageInfo() {
      const start = (currentPage - 1) * itemsPerPage + 1;
      const end = Math.min(currentPage * itemsPerPage, allUsers.length);
      document.getElementById('pageInfo').textContent = 
        `Showing ${start}-${end} of ${allUsers.length} entries`;
    }

    function renderPagination() {
      const totalPages = getTotalPages();
      const pagination = document.getElementById('pagination');
      
      let html = `
        <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>First</button>
        <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += `<span style="padding: 0 10px;">...</span>`;
        }
      }

      html += `
        <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
        <button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last</button>
      `;

      pagination.innerHTML = html;
    }

    function goToPage(page) {
      const totalPages = getTotalPages();
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
      renderPagination();
    }

    function changeItemsPerPage() {
      itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
      currentPage = 1;
      renderTable();
      renderPagination();
    }

    // Initialize
    renderTable();
    renderPagination();
  </script>
</body>
</html>
