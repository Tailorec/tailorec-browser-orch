<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Download Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .download-section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .download-section h2 { margin-top: 0; color: #333; }
    .download-btn { 
      display: inline-block;
      padding: 10px 20px; 
      background: #007bff; 
      color: white; 
      text-decoration: none; 
      border-radius: 4px;
      margin: 5px;
      cursor: pointer;
      border: none;
    }
    .download-btn:hover { background: #0056b3; }
    .download-status { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .progress { background: #e9ecef; border-radius: 4px; overflow: hidden; }
    .progress-bar { 
      height: 20px; 
      background: #28a745; 
      width: 0%; 
      transition: width 0.3s;
      text-align: center;
      color: white;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>File Download Test Page</h1>

  <div class="download-section">
    <h2>Single File Download</h2>
    <a href="#" class="download-btn" onclick="startDownload('pdf'); return false;">Download PDF</a>
    <a href="#" class="download-btn" onclick="startDownload('txt'); return false;">Download TXT</a>
    <a href="#" class="download-btn" onclick="startDownload('json'); return false;">Download JSON</a>
    <a href="#" class="download-btn" onclick="startDownload('csv'); return false;">Download CSV</a>
    <div class="download-status" id="singleDownloadStatus"></div>
  </div>

  <div class="download-section">
    <h2>Download with Confirmation</h2>
    <button class="download-btn" onclick="startConfirmDownload()">Download with Confirmation</button>
    <div class="download-status" id="confirmDownloadStatus"></div>
  </div>

  <div class="download-section">
    <h2>Multiple Downloads</h2>
    <button class="download-btn" onclick="startMultipleDownloads()">Download All Files</button>
    <div class="download-status" id="multipleDownloadStatus"></div>
  </div>

  <div class="download-section">
    <h2>Download with Progress</h2>
    <button class="download-btn" onclick="startProgressDownload()">Download Large File</button>
    <div class="progress" style="margin-top: 10px;">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
    <div class="download-status" id="progressDownloadStatus"></div>
  </div>

  <div class="download-section">
    <h2>Error Simulation</h2>
    <button class="download-btn" onclick="simulateDownloadError()">Simulate Download Error</button>
    <div class="download-status" id="errorDownloadStatus"></div>
  </div>

  <script>
    let downloadCount = 0;

    function startDownload(type) {
      const statusEl = document.getElementById('singleDownloadStatus');
      statusEl.innerHTML = `<div class="success">Starting ${type.toUpperCase()} download...</div>`;
      
      // Simulate download start
      setTimeout(() => {
        statusEl.innerHTML += `<div>Download initiated for ${type} file</div>`;
      }, 500);
    }

    function startConfirmDownload() {
      const statusEl = document.getElementById('confirmDownloadStatus');
      statusEl.innerHTML = `<div>Preparing download...</div>`;
      
      setTimeout(() => {
        statusEl.innerHTML = `<div class="success">✓ Download ready. Click to confirm.</div>`;
      }, 1000);
    }

    function startMultipleDownloads() {
      const statusEl = document.getElementById('multipleDownloadStatus');
      downloadCount = 0;
      statusEl.innerHTML = `<div>Starting multiple downloads...</div>`;
      
      const files = ['file1.txt', 'file2.pdf', 'file3.json'];
      files.forEach((file, index) => {
        setTimeout(() => {
          downloadCount++;
          statusEl.innerHTML += `<div>✓ Downloaded: ${file}</div>`;
          if (downloadCount === files.length) {
            statusEl.innerHTML += `<div class="success">All ${files.length} files downloaded!</div>`;
          }
        }, index * 500);
      });
    }

    function startProgressDownload() {
      const statusEl = document.getElementById('progressDownloadStatus');
      const progressBar = document.getElementById('progressBar');
      statusEl.innerHTML = `<div>Starting large file download...</div>`;
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += 10;
        progressBar.style.width = progress + '%';
        progressBar.textContent = progress + '%';
        
        if (progress >= 100) {
          clearInterval(interval);
          statusEl.innerHTML += `<div class="success">✓ Download complete!</div>`;
        }
      }, 200);
    }

    function simulateDownloadError() {
      const statusEl = document.getElementById('errorDownloadStatus');
      statusEl.innerHTML = `<div>Starting download...</div>`;
      
      setTimeout(() => {
        statusEl.innerHTML = `<div class="error">✗ Download failed: Network error</div>`;
        statusEl.innerHTML += `<button class="download-btn" onclick="this.parentElement.innerHTML += '<div>Retrying...</div>'" style="margin-top: 10px;">Retry Download</button>`;
      }, 1000);
    }
  </script>
</body>
</html>
