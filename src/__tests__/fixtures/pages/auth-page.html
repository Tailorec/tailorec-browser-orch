<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    .auth-section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .auth-section h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    input:focus { border-color: #007bff; outline: none; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; width: 100%; }
    button:hover { background: #0056b3; }
    .message { padding: 10px; margin-top: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .user-info { display: none; padding: 15px; background: #e7f3ff; border-radius: 4px; margin-top: 15px; }
    .user-info.show { display: block; }
    .links { margin-top: 15px; text-align: center; }
    .links a { color: #007bff; text-decoration: none; margin: 0 10px; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Authentication Test</h1>

  <!-- Login Form -->
  <div class="auth-section" id="loginSection">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" placeholder="user@example.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="Enter password" required>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="rememberMe" name="rememberMe"> Remember me</label>
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="message" id="loginMessage"></div>
    <div class="user-info" id="userInfo">
      <h3>Welcome, <span id="userName">User</span>!</h3>
      <p>Email: <span id="userEmail"></span></p>
      <button onclick="logout()" style="background: #dc3545; margin-top: 10px;">Logout</button>
    </div>
    <div class="links">
      <a href="#" onclick="showRegister(); return false;">Register</a>
      <a href="#" onclick="showForgot(); return false;">Forgot Password?</a>
    </div>
  </div>

  <!-- Register Form -->
  <div class="auth-section" id="registerSection" style="display: none;">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="registerName">Full Name</label>
        <input type="text" id="registerName" name="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" name="email" placeholder="user@example.com" required>
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" placeholder="Min 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label for="registerConfirm">Confirm Password</label>
        <input type="password" id="registerConfirm" name="confirmPassword" placeholder="Confirm password" required>
      </div>
      <button type="submit">Register</button>
    </form>
    <div class="message" id="registerMessage"></div>
    <div class="links">
      <a href="#" onclick="showLogin(); return false;">Back to Login</a>
    </div>
  </div>

  <!-- Forgot Password Form -->
  <div class="auth-section" id="forgotSection" style="display: none;">
    <h2>Forgot Password</h2>
    <form id="forgotForm">
      <div class="form-group">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" name="email" placeholder="Enter your email" required>
      </div>
      <button type="submit">Send Reset Link</button>
    </form>
    <div class="message" id="forgotMessage"></div>
    <div class="links">
      <a href="#" onclick="showLogin(); return false;">Back to Login</a>
    </div>
  </div>

  <script>
    let isLoggedIn = false;
    let currentUser = null;

    function showLogin() {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('registerSection').style.display = 'none';
      document.getElementById('forgotSection').style.display = 'none';
    }

    function showRegister() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('registerSection').style.display = 'block';
      document.getElementById('forgotSection').style.display = 'none';
    }

    function showForgot() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('registerSection').style.display = 'none';
      document.getElementById('forgotSection').style.display = 'block';
    }

    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = 'message ' + type;
      el.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      // Simulate login
      if (email && password.length >= 6) {
        isLoggedIn = true;
        currentUser = { email, name: email.split('@')[0] };
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userEmail').textContent = email;
        document.getElementById('userInfo').classList.add('show');
        document.getElementById('loginForm').style.display = 'none';
        showMessage('loginMessage', 'Login successful!', 'success');
      } else {
        showMessage('loginMessage', 'Invalid credentials. Password must be at least 6 characters.', 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      
      if (password !== confirm) {
        showMessage('registerMessage', 'Passwords do not match!', 'error');
        return;
      }
      
      if (password.length < 8) {
        showMessage('registerMessage', 'Password must be at least 8 characters.', 'error');
        return;
      }
      
      showMessage('registerMessage', 'Registration successful! You can now login.', 'success');
      setTimeout(showLogin, 1500);
    });

    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;
      showMessage('forgotMessage', `Password reset link sent to ${email}`, 'success');
    });

    function logout() {
      isLoggedIn = false;
      currentUser = null;
      document.getElementById('userInfo').classList.remove('show');
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginMessage').style.display = 'none';
    }
  </script>
</body>
</html>
