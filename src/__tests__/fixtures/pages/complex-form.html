<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complex Form - Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .form-section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .form-section h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    .checkbox-group, .radio-group { margin: 10px 0; }
    .checkbox-group label, .radio-group label { display: inline-flex; align-items: center; margin-right: 15px; font-weight: normal; }
    .checkbox-group input, .radio-group input { width: auto; margin-right: 5px; }
    button { padding: 10px 20px; margin-right: 10px; cursor: pointer; }
    .btn-primary { background: #007bff; color: white; border: none; }
    .btn-secondary { background: #6c757d; color: white; border: none; }
    .btn-primary:hover { background: #0056b3; }
    .btn-secondary:hover { background: #545b62; }
  </style>
</head>
<body>
  <h1>Job Application Form</h1>
  <form id="jobApplicationForm">
    <!-- Personal Information -->
    <div class="form-section">
      <h2>Personal Information</h2>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">
      </div>
    </div>

    <!-- Position Details -->
    <div class="form-section">
      <h2>Position Details</h2>
      <div class="form-group">
        <label for="position">Position Applied For</label>
        <select id="position" name="position" required>
          <option value="">Select a position</option>
          <option value="frontend">Frontend Developer</option>
          <option value="backend">Backend Developer</option>
          <option value="fullstack">Full Stack Developer</option>
          <option value="designer">UI/UX Designer</option>
          <option value="manager">Engineering Manager</option>
        </select>
      </div>
      <div class="form-group">
        <label for="startDate">Available Start Date</label>
        <input type="date" id="startDate" name="startDate">
      </div>
      <div class="form-group">
        <label for="salary">Expected Salary</label>
        <input type="number" id="salary" name="salary" min="0" step="1000" placeholder="e.g., 75000">
      </div>
    </div>

    <!-- Experience -->
    <div class="form-section">
      <h2>Experience</h2>
      <div class="form-group">
        <label for="experience">Years of Experience</label>
        <select id="experience" name="experience">
          <option value="0">Entry Level (0-1 years)</option>
          <option value="1">Junior (1-3 years)</option>
          <option value="3">Mid-Level (3-5 years)</option>
          <option value="5">Senior (5-8 years)</option>
          <option value="8">Lead (8+ years)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Skills (select all that apply)</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
          <label><input type="checkbox" name="skills" value="typescript"> TypeScript</label>
          <label><input type="checkbox" name="skills" value="react"> React</label>
          <label><input type="checkbox" name="skills" value="node"> Node.js</label>
          <label><input type="checkbox" name="skills" value="python"> Python</label>
          <label><input type="checkbox" name="skills" value="java"> Java</label>
        </div>
      </div>
    </div>

    <!-- Preferences -->
    <div class="form-section">
      <h2>Work Preferences</h2>
      <div class="form-group">
        <label>Preferred Work Arrangement</label>
        <div class="radio-group">
          <label><input type="radio" name="workType" value="onsite"> On-site</label>
          <label><input type="radio" name="workType" value="hybrid"> Hybrid</label>
          <label><input type="radio" name="workType" value="remote"> Remote</label>
        </div>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="relocate" name="relocate"> Willing to relocate</label>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="terms" name="terms" required> I agree to the terms and conditions</label>
      </div>
    </div>

    <!-- Additional Information -->
    <div class="form-section">
      <h2>Additional Information</h2>
      <div class="form-group">
        <label for="coverLetter">Cover Letter</label>
        <textarea id="coverLetter" name="coverLetter" rows="5" placeholder="Tell us why you're a great fit..."></textarea>
      </div>
      <div class="form-group">
        <label for="portfolio">Portfolio URL</label>
        <input type="url" id="portfolio" name="portfolio" placeholder="https://">
      </div>
      <div class="form-group">
        <label for="resume">Resume (PDF)</label>
        <input type="file" id="resume" name="resume" accept=".pdf">
      </div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">Submit Application</button>
    <button type="reset" class="btn-secondary" id="resetBtn">Reset Form</button>
  </form>

  <script>
    document.getElementById('jobApplicationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Application submitted successfully!');
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      setTimeout(() => {
        console.log('Form reset');
      }, 100);
    });
  </script>
</body>
</html>
