<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Content Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .section h2 { margin-top: 0; color: #333; }
    button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .item { padding: 10px; margin: 5px 0; background: #f0f0f0; border-radius: 4px; }
    .item.hidden { display: none; }
    .item.loading { opacity: 0.5; }
    .counter { font-size: 24px; font-weight: bold; color: #007bff; }
    #dynamicList { list-style: none; padding: 0; }
    #dynamicList li { padding: 8px; margin: 4px 0; background: #e7f3ff; border-radius: 4px; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .status.loading { background: #fff3cd; color: #856404; }
    .status.loaded { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Dynamic Content Test</h1>

  <div class="section">
    <h2>Lazy Loading Content</h2>
    <button id="loadContentBtn" onclick="loadContent()">Load Content</button>
    <div id="lazyContent" style="margin-top: 15px;"></div>
  </div>

  <div class="section">
    <h2>Infinite Scroll Simulation</h2>
    <div id="scrollContainer" style="height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;">
      <div id="scrollContent"></div>
    </div>
    <button id="loadMoreBtn" onclick="loadMoreItems()">Load More</button>
  </div>

  <div class="section">
    <h2>Dynamic List</h2>
    <button id="addItemBtn" onclick="addItem()">Add Item</button>
    <button id="removeItemBtn" onclick="removeItem()">Remove Item</button>
    <button id="clearItemsBtn" onclick="clearItems()">Clear All</button>
    <ul id="dynamicList"></ul>
  </div>

  <div class="section">
    <h2>Counter (State Updates)</h2>
    <button id="decrementBtn" onclick="updateCounter(-1)">-</button>
    <span id="counter" class="counter">0</span>
    <button id="incrementBtn" onclick="updateCounter(1)">+</button>
    <button id="resetCounterBtn" onclick="resetCounter()">Reset</button>
  </div>

  <div class="section">
    <h2>Async Data Loading</h2>
    <button id="fetchDataBtn" onclick="fetchData()">Fetch Data</button>
    <div id="dataStatus"></div>
    <pre id="dataContent" style="background: #f5f5f5; padding: 10px; overflow: auto;"></pre>
  </div>

  <div class="section">
    <h2>DOM Mutations</h2>
    <button id="mutateBtn" onclick="mutateDom()">Mutate DOM</button>
    <div id="mutationTarget" style="margin-top: 10px; padding: 10px; background: #f0f0f0;">
      Original content
    </div>
  </div>

  <script>
    // Lazy loading
    function loadContent() {
      const container = document.getElementById('lazyContent');
      container.innerHTML = '<div class="status loading">Loading...</div>';
      
      setTimeout(() => {
        container.innerHTML = `
          <div class="item">Item 1 - Loaded dynamically</div>
          <div class="item">Item 2 - Loaded dynamically</div>
          <div class="item">Item 3 - Loaded dynamically</div>
          <div class="status loaded">Content loaded successfully!</div>
        `;
      }, 1000);
    }

    // Infinite scroll
    let scrollItemCount = 0;
    function loadMoreItems() {
      const container = document.getElementById('scrollContent');
      for (let i = 0; i < 5; i++) {
        scrollItemCount++;
        const item = document.createElement('div');
        item.className = 'item';
        item.textContent = `Scroll Item ${scrollItemCount}`;
        container.appendChild(item);
      }
    }

    // Initialize with some items
    loadMoreItems();
    loadMoreItems();

    // Dynamic list
    let listItemCount = 0;
    function addItem() {
      listItemCount++;
      const list = document.getElementById('dynamicList');
      const li = document.createElement('li');
      li.id = `listItem${listItemCount}`;
      li.textContent = `Dynamic Item ${listItemCount}`;
      list.appendChild(li);
    }

    function removeItem() {
      const list = document.getElementById('dynamicList');
      if (list.lastChild) {
        list.removeChild(list.lastChild);
      }
    }

    function clearItems() {
      document.getElementById('dynamicList').innerHTML = '';
    }

    // Counter
    let counterValue = 0;
    function updateCounter(delta) {
      counterValue += delta;
      document.getElementById('counter').textContent = counterValue;
    }

    function resetCounter() {
      counterValue = 0;
      document.getElementById('counter').textContent = '0';
    }

    // Async data
    function fetchData() {
      const status = document.getElementById('dataStatus');
      const content = document.getElementById('dataContent');
      
      status.className = 'status loading';
      status.textContent = 'Fetching data...';
      content.textContent = '';

      setTimeout(() => {
        const data = {
          id: 1,
          name: 'Test Data',
          timestamp: new Date().toISOString(),
          items: ['Item A', 'Item B', 'Item C'],
          metadata: { version: '1.0', source: 'test' }
        };
        
        status.className = 'status loaded';
        status.textContent = 'Data loaded successfully!';
        content.textContent = JSON.stringify(data, null, 2);
      }, 1500);
    }

    // DOM Mutations
    let mutationCount = 0;
    function mutateDom() {
      mutationCount++;
      const target = document.getElementById('mutationTarget');
      
      // Change content
      target.innerHTML = `
        <div>Mutation #${mutationCount}</div>
        <div>Timestamp: ${new Date().toLocaleTimeString()}</div>
        <div>Random value: ${Math.random().toFixed(4)}</div>
      `;
      
      // Change style
      target.style.background = `hsl(${mutationCount * 30}, 70%, 80%)`;
      
      // Add/remove classes
      target.classList.toggle('loading');
      setTimeout(() => target.classList.remove('loading'), 500);
    }

    // Auto-update counter every 5 seconds
    setInterval(() => {
      if (document.getElementById('counter')) {
        updateCounter(1);
      }
    }, 5000);
  </script>
</body>
</html>
