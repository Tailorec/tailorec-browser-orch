<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; }
    .progress-bar { display: flex; margin-bottom: 30px; }
    .progress-step { 
      flex: 1; 
      text-align: center; 
      padding: 10px; 
      background: #e9ecef; 
      border-radius: 4px;
      margin: 0 5px;
      position: relative;
    }
    .progress-step.active { background: #007bff; color: white; }
    .progress-step.completed { background: #28a745; color: white; }
    .form-step { display: none; }
    .form-step.active { display: block; }
    .form-section { padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
    .form-section h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    .btn-group { margin-top: 20px; display: flex; justify-content: space-between; }
    button { padding: 10px 20px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-primary { background: #007bff; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-success { background: #28a745; color: white; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .validation-error { color: #dc3545; font-size: 12px; margin-top: 5px; }
    #successMessage { display: none; padding: 20px; background: #d4edda; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Multi-Step Registration Form</h1>
  
  <div class="progress-bar" id="progressBar">
    <div class="progress-step active" data-step="1">1. Personal</div>
    <div class="progress-step" data-step="2">2. Account</div>
    <div class="progress-step" data-step="3">3. Preferences</div>
    <div class="progress-step" data-step="4">4. Review</div>
  </div>

  <form id="multiStepForm">
    <!-- Step 1: Personal Information -->
    <div class="form-step active" data-step="1">
      <div class="form-section">
        <h2>Personal Information</h2>
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" name="firstName" required>
          <div class="validation-error" id="firstNameError"></div>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" name="lastName" required>
          <div class="validation-error" id="lastNameError"></div>
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
          <div class="validation-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" disabled>Back</button>
        <button type="button" class="btn-primary" onclick="nextStep(1)">Next</button>
      </div>
    </div>

    <!-- Step 2: Account Information -->
    <div class="form-step" data-step="2">
      <div class="form-section">
        <h2>Account Information</h2>
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" required>
          <div class="validation-error" id="usernameError"></div>
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required minlength="8">
          <div class="validation-error" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
          <div class="validation-error" id="confirmPasswordError"></div>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="prevStep(2)">Back</button>
        <button type="button" class="btn-primary" onclick="nextStep(2)">Next</button>
      </div>
    </div>

    <!-- Step 3: Preferences -->
    <div class="form-step" data-step="3">
      <div class="form-section">
        <h2>Preferences</h2>
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country">
            <option value="">Select a country</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="ca">Canada</option>
            <option value="au">Australia</option>
          </select>
        </div>
        <div class="form-group">
          <label for="timezone">Timezone</label>
          <select id="timezone" name="timezone">
            <option value="">Select timezone</option>
            <option value="est">Eastern Time (EST)</option>
            <option value="pst">Pacific Time (PST)</option>
            <option value="gmt">Greenwich Mean Time (GMT)</option>
            <option value="utc">Coordinated Universal Time (UTC)</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="newsletter" name="newsletter"> Subscribe to newsletter</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="terms" name="terms"> I agree to the terms and conditions *</label>
          <div class="validation-error" id="termsError"></div>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="prevStep(3)">Back</button>
        <button type="button" class="btn-primary" onclick="nextStep(3)">Next</button>
      </div>
    </div>

    <!-- Step 4: Review -->
    <div class="form-step" data-step="4">
      <div class="form-section">
        <h2>Review Your Information</h2>
        <div id="reviewContent"></div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="prevStep(4)">Back</button>
        <button type="submit" class="btn-success">Submit Registration</button>
      </div>
    </div>
  </form>

  <div id="successMessage">
    <h2>✓ Registration Successful!</h2>
    <p>Thank you for registering. Your account has been created.</p>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;

    function updateProgressBar() {
      for (let i = 1; i <= totalSteps; i++) {
        const step = document.querySelector(`.progress-step[data-step="${i}"]`);
        step.classList.remove('active', 'completed');
        if (i < currentStep) {
          step.classList.add('completed');
        } else if (i === currentStep) {
          step.classList.add('active');
        }
      }
    }

    function showStep(step) {
      document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
      document.querySelector(`.form-step[data-step="${step}"]`).classList.add('active');
      currentStep = step;
      updateProgressBar();
      
      if (step === 4) {
        populateReview();
      }
    }

    function nextStep(current) {
      if (!validateStep(current)) {
        return;
      }
      showStep(current + 1);
    }

    function prevStep(current) {
      showStep(current - 1);
    }

    function validateStep(step) {
      let valid = true;
      
      if (step === 1) {
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const email = document.getElementById('email').value;
        
        if (!firstName) {
          document.getElementById('firstNameError').textContent = 'First name is required';
          valid = false;
        } else {
          document.getElementById('firstNameError').textContent = '';
        }
        
        if (!lastName) {
          document.getElementById('lastNameError').textContent = 'Last name is required';
          valid = false;
        } else {
          document.getElementById('lastNameError').textContent = '';
        }
        
        if (!email || !email.includes('@')) {
          document.getElementById('emailError').textContent = 'Valid email is required';
          valid = false;
        } else {
          document.getElementById('emailError').textContent = '';
        }
      }
      
      if (step === 2) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (!username) {
          document.getElementById('usernameError').textContent = 'Username is required';
          valid = false;
        } else {
          document.getElementById('usernameError').textContent = '';
        }
        
        if (!password || password.length < 8) {
          document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
          valid = false;
        } else {
          document.getElementById('passwordError').textContent = '';
        }
        
        if (password !== confirmPassword) {
          document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
          valid = false;
        } else {
          document.getElementById('confirmPasswordError').textContent = '';
        }
      }
      
      if (step === 3) {
        const terms = document.getElementById('terms').checked;
        if (!terms) {
          document.getElementById('termsError').textContent = 'You must agree to the terms';
          valid = false;
        } else {
          document.getElementById('termsError').textContent = '';
        }
      }
      
      return valid;
    }

    function populateReview() {
      const data = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        username: document.getElementById('username').value,
        country: document.getElementById('country').value,
        timezone: document.getElementById('timezone').value,
        newsletter: document.getElementById('newsletter').checked,
        terms: document.getElementById('terms').checked
      };
      
      const review = document.getElementById('reviewContent');
      review.innerHTML = `
        <h3>Personal Information</h3>
        <p><strong>Name:</strong> ${data.firstName} ${data.lastName}</p>
        <p><strong>Email:</strong> ${data.email}</p>
        <p><strong>Phone:</strong> ${data.phone || 'Not provided'}</p>
        <h3>Account Information</h3>
        <p><strong>Username:</strong> ${data.username}</p>
        <h3>Preferences</h3>
        <p><strong>Country:</strong> ${data.country || 'Not selected'}</p>
        <p><strong>Timezone:</strong> ${data.timezone || 'Not selected'}</p>
        <p><strong>Newsletter:</strong> ${data.newsletter ? 'Subscribed' : 'Not subscribed'}</p>
        <p><strong>Terms:</strong> ${data.terms ? 'Agreed' : 'Not agreed'}</p>
      `;
    }

    document.getElementById('multiStepForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('multiStepForm').style.display = 'none';
      document.getElementById('progressBar').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    });
  </script>
</body>
</html>
