name: Coverage

on:
  push:
    branches: [main]

jobs:
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage:phase2

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  enforce:
    name: Enforce Coverage Threshold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run coverage check
        run: |
          npm run test:coverage:phase2 2>&1 | tee coverage-output.txt
          if grep -q "ERROR" coverage-output.txt; then
            echo "Coverage threshold not met"
            exit 1
          fi
